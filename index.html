<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リズムゲーム</title>
<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: sans-serif;
  text-align: center;
}
#game {
  position: relative;
  width: 400px;
  height: 600px;
  margin: 20px auto;
  background: #222;
  overflow: hidden;
  border-radius: 10px;
}
.lane {
  position: absolute;
  width: 25%;
  height: 100%;
  border-left: 1px solid #444;
}
.note {
  position: absolute;
  width: 90%;
  height: 10px;
  background: cyan;
  left: 5%;
  border-radius: 5px;
}
#hitLine {
  position: absolute;
  bottom: 80px;
  width: 100%;
  height: 5px;
  background: red;
}
#score {
  font-size: 24px;
}
button {
  padding: 10px 20px;
  font-size: 18px;
}
</style>
</head>
<body>
<h1>リズムゲーム</h1>
<p>【操作方法】<br>
Dキー：左レーン<br>
Fキー：中央左レーン<br>
Jキー：中央右レーン<br>
Kキー：右レーン<br>
赤いラインにノーツが来たタイミングでキーを押そう！</p>
<div id="score">Score: 0</div>
<button onclick="startGame()">スタート</button>
<div id="game">
  <div id="hitLine"></div>
</div>

<script>
const game = document.getElementById("game");
const scoreDisplay = document.getElementById("score");

let score = 0;
let notes = [];
let gameInterval;

const lanes = 4;
const laneWidth = 100 / lanes;

// レーン作成
for (let i = 0; i < lanes; i++) {
  const lane = document.createElement("div");
  lane.className = "lane";
  lane.style.left = (i * laneWidth) + "%";
  game.appendChild(lane);
}

function createNote() {
  const lane = Math.floor(Math.random() * lanes);
  const note = document.createElement("div");
  note.className = "note";
  note.style.left = (lane * laneWidth + 2.5) + "%";
  note.style.top = "0px";
  game.appendChild(note);

  notes.push({ element: note, lane: lane, y: 0 });
}

function updateGame() {
  notes.forEach((note, index) => {
    note.y += 4;
    note.element.style.top = note.y + "px";

    if (note.y > 600) {
      game.removeChild(note.element);
      notes.splice(index, 1);
    }
  });
}

function hitCheck(lane) {
  notes.forEach((note, index) => {
    if (note.lane === lane && note.y > 480 && note.y < 540) {
      score += 10;
      scoreDisplay.textContent = "Score: " + score;
      game.removeChild(note.element);
      notes.splice(index, 1);
    }
  });
}

// キー操作
window.addEventListener("keydown", (e) => {
  if (e.key === "d") hitCheck(0);
  if (e.key === "f") hitCheck(1);
  if (e.key === "j") hitCheck(2);
  if (e.key === "k") hitCheck(3);
});

function startGame() {
  score = 0;
  notes = [];
  scoreDisplay.textContent = "Score: 0";

  clearInterval(gameInterval);

  gameInterval = setInterval(() => {
    updateGame();
  }, 16);

  setInterval(createNote, 800);
}
</script>
</body>
</html>
