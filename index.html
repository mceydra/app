<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シンプルインベーダーゲーム</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #111;
  }
</style>
</head>
<body>
<h1>インベーダー風ゲーム</h1>
<p>← → で移動 / スペースで発射</p>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 180, y: 550, w: 40, h: 20 };
let bullets = [];
let enemies = [];
let gameOver = false;
let win = false;

for (let r = 0; r < 4; r++) {
  for (let c = 0; c < 6; c++) {
    enemies.push({ x: 50 + c * 50, y: 50 + r * 40, w: 30, h: 20 });
  }
}

let keys = {};
document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === " ") {
    bullets.push({ x: player.x + 18, y: player.y });
  }
});
document.addEventListener("keyup", e => keys[e.key] = false);

function update() {
  if (gameOver) return;

  if (keys["ArrowLeft"]) player.x -= 5;
  if (keys["ArrowRight"]) player.x += 5;

  bullets.forEach(b => b.y -= 5);

  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (b.x < e.x + e.w &&
          b.x + 5 > e.x &&
          b.y < e.y + e.h &&
          b.y + 10 > e.y) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
      }
    });
  });

  enemies.forEach(e => {
    e.y += 0.2;
    if (e.y > player.y) {
      gameOver = true;
    }
  });

  if (enemies.length === 0) {
    win = true;
    gameOver = true;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  bullets.forEach(b => {
    ctx.fillRect(b.x, b.y, 5, 10);
  });

  ctx.fillStyle = "lime";
  enemies.forEach(e => {
    ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "30px sans-serif";
    ctx.fillText(win ? "CLEAR!" : "GAME OVER", 110, 300);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
