<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini Kart Game</title>
<style>
body { margin:0; background:#222; overflow:hidden; }
canvas { display:block; margin:0 auto; background:#555; }
#ui {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  color:white; font-family:sans-serif;
}
</style>
</head>
<body>
<div id="ui">← → で移動 / ↑で加速</div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

let player = { x: 200, y: 500, w: 30, h: 50, speed: 0 };
let obstacles = [];
let score = 0;

function spawnObstacle(){
  obstacles.push({
    x: Math.random() * 360,
    y: -50,
    w: 30,
    h: 50,
    speed: 3 + Math.random() * 2
  });
}

setInterval(spawnObstacle, 1000);

function update(){
  // 操作
  if(keys["ArrowLeft"]) player.x -= 5;
  if(keys["ArrowRight"]) player.x += 5;
  if(keys["ArrowUp"]) player.speed = Math.min(player.speed + 0.1, 8);
  else player.speed *= 0.98;

  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  // 障害物
  for(let i = obstacles.length - 1; i >= 0; i--){
    let o = obstacles[i];
    o.y += o.speed + player.speed * 0.5;

    // 当たり判定
    if(player.x < o.x + o.w &&
       player.x + player.w > o.x &&
       player.y < o.y + o.h &&
       player.y + player.h > o.y){
      alert("ゲームオーバー！スコア: " + score);
      location.reload();
    }

    if(o.y > canvas.height){
      obstacles.splice(i,1);
      score++;
    }
  }
}

function drawRoad(){
  ctx.fillStyle = "#444";
  ctx.fillRect(100, 0, 200, canvas.height);

  ctx.strokeStyle = "white";
  ctx.setLineDash([20,20]);
  ctx.beginPath();
  ctx.moveTo(200, 0);
  ctx.lineTo(200, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlayer(){
  ctx.fillStyle = "red";
  ctx.fillRect(player.x, player.y, player.w, player.h);
}

function drawObstacles(){
  ctx.fillStyle = "blue";
  obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
}

function drawUI(){
  ctx.fillStyle = "white";
  ctx.font = "16px sans-serif";
  ctx.fillText("Score: " + score, 10, 20);
}

function gameLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  update();
  drawRoad();
  drawPlayer();
  drawObstacles();
  drawUI();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
