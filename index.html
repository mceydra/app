<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Stylish Mini Kart Game</title>
<style>
*{box-sizing:border-box}
body {
  margin:0;
  background: radial-gradient(circle at center, #1b2735, #090a0f);
  overflow:hidden;
  font-family: 'Segoe UI', sans-serif;
}
canvas {
  display:block;
  margin:20px auto;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  background:#2c2c2c;
}
#ui {
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,0.5);
  padding:8px 16px;
  border-radius:20px;
  font-size:14px;
}
</style>
</head>
<body>
<div id="ui">← → 移動 / ↑ 加速</div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

let player = { x: 200, y: 500, w: 30, h: 50, speed: 0 };
let obstacles = [];
let score = 0;
let roadOffset = 0;

function spawnObstacle(){
  obstacles.push({
    x: 120 + Math.random() * 160,
    y: -50,
    w: 30,
    h: 50,
    speed: 3 + Math.random() * 2
  });
}
setInterval(spawnObstacle, 900);

function update(){
  if(keys["ArrowLeft"]) player.x -= 5;
  if(keys["ArrowRight"]) player.x += 5;
  if(keys["ArrowUp"]) player.speed = Math.min(player.speed + 0.15, 10);
  else player.speed *= 0.97;

  player.x = Math.max(110, Math.min(260, player.x));

  roadOffset += player.speed;

  for(let i = obstacles.length - 1; i >= 0; i--){
    let o = obstacles[i];
    o.y += o.speed + player.speed * 0.6;

    if(player.x < o.x + o.w &&
       player.x + player.w > o.x &&
       player.y < o.y + o.h &&
       player.y + player.h > o.y){
      alert("ゲームオーバー！スコア: " + score);
      location.reload();
    }

    if(o.y > canvas.height){
      obstacles.splice(i,1);
      score++;
    }
  }
}

function drawRoad(){
  // 芝生
  ctx.fillStyle = "#2ecc71";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 道
  ctx.fillStyle = "#555";
  ctx.fillRect(100,0,200,canvas.height);

  // 路肩
  ctx.fillStyle = "#e74c3c";
  for(let y = -40; y < canvas.height; y += 40){
    ctx.fillRect(100, y + (roadOffset % 40), 10, 20);
    ctx.fillRect(290, y + (roadOffset % 40), 10, 20);
  }

  // センターライン
  ctx.strokeStyle = "#fff";
  ctx.setLineDash([20,20]);
  ctx.beginPath();
  ctx.moveTo(200, -40 + (roadOffset % 40));
  ctx.lineTo(200, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlayer(){
  ctx.fillStyle = "#ff4757";
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.w, player.h, 8);
  ctx.fill();

  // 窓
  ctx.fillStyle = "#ecf0f1";
  ctx.fillRect(player.x+5, player.y+5, 20, 10);
}

function drawObstacles(){
  obstacles.forEach(o => {
    ctx.fillStyle = "#3498db";
    ctx.beginPath();
    ctx.roundRect(o.x, o.y, o.w, o.h, 8);
    ctx.fill();
  });
}

function drawUI(){
  ctx.fillStyle = "white";
  ctx.font = "bold 18px sans-serif";
  ctx.fillText("Score: " + score, 10, 25);
}

function gameLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  update();
  drawRoad();
  drawPlayer();
  drawObstacles();
  drawUI();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
