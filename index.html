<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini Invader Game</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    margin: 20px auto;
    background: #111;
    border: 2px solid white;
  }
</style>
</head>
<body>
<h1>Mini Invader Game</h1>
<p>← → で移動 / スペースで発射</p>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let player = {
  x: 180,
  y: 550,
  width: 40,
  height: 20,
  speed: 5
};

let bullets = [];
let enemies = [];
let keys = {};
let score = 0;
let gameClear = false;

// 敵生成
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 8; col++) {
    enemies.push({
      x: 40 + col * 40,
      y: 40 + row * 40,
      width: 30,
      height: 20,
      alive: true
    });
  }
}

let enemyDirection = 1;

function drawPlayer() {
  ctx.fillStyle = 'cyan';
  ctx.fillRect(player.x, player.y, player.width, player.height);
}

function drawBullets() {
  ctx.fillStyle = 'yellow';
  bullets.forEach(b => {
    ctx.fillRect(b.x, b.y, 4, 10);
  });
}

function drawEnemies() {
  ctx.fillStyle = 'lime';
  enemies.forEach(e => {
    if (e.alive) ctx.fillRect(e.x, e.y, e.width, e.height);
  });
}

function update() {
  // 移動
  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;

  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

  // 弾移動
  bullets.forEach(b => b.y -= 7);
  bullets = bullets.filter(b => b.y > 0);

  // 敵移動
  let hitEdge = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += enemyDirection * 1;
    if (e.x < 0 || e.x + e.width > canvas.width) {
      hitEdge = true;
    }
  });

  if (hitEdge) {
    enemyDirection *= -1;
    enemies.forEach(e => e.y += 20);
  }

  // 当たり判定
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (e.alive &&
          b.x < e.x + e.width &&
          b.x + 4 > e.x &&
          b.y < e.y + e.height &&
          b.y + 10 > e.y) {
        e.alive = false;
        b.y = -10;
        score += 10;
      }
    });
  });

  // クリア判定
  const allDead = enemies.every(e => !e.alive);
  if (allDead) {
    gameClear = true;
  }
}
  });

  if (hitEdge) {
    enemyDirection *= -1;
    enemies.forEach(e => e.y += 20);
  }

  // 当たり判定
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (e.alive &&
          b.x < e.x + e.width &&
          b.x + 4 > e.x &&
          b.y < e.y + e.height &&
          b.y + 10 > e.y) {
        e.alive = false;
        b.y = -10;
        score += 10;
      }
    });
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawPlayer();
  drawBullets();
  drawEnemies();

  ctx.fillStyle = 'white';
  ctx.fillText('Score: ' + score, 10, 20);

  if (gameClear) {
    ctx.fillStyle = 'yellow';
    ctx.font = '30px Arial';
    ctx.fillText('CLEAR!', 140, 300);
  }
}

function loop() {
  if (!gameClear) {
    update();
  }
  draw();
  requestAnimationFrame(loop);
}

// 入力
document.addEventListener('keydown', e => {
  keys[e.code] = true;

  if (e.code === 'Space') {
    bullets.push({ x: player.x + player.width / 2, y: player.y });
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

loop();
</script>
</body>
</html>
